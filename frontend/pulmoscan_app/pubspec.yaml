name: pulmoscan_app
description: "Application mobile de détection des maladies pulmonaires"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^8.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.10.4
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/pulmoscan_model.tflite
